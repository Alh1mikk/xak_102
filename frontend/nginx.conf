server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 70s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
