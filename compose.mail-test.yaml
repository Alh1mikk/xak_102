services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: afisha@example.test
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_IMPLICIT_TLS: "false"
      EMAIL_CODE_SECRET: local-mailpit-testing-only-not-for-production
    depends_on:
      mailpit:
        condition: service_started
